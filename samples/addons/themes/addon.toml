# Sample add-on: three themes, nothing else (no programs, no commands).
#
# Shipped with CodeShellManager under <install dir>\samples\addons\. Settings > Add-ons >
# "Install samples" copies it into your add-ons folder; it stays off until you Enable it. Then
# Settings > Appearance offers the themes as the dark theme. See docs/addons.md, "Themes".
#
# Catppuccin Frappé and Macchiato are the official Catppuccin palettes
# (https://github.com/catppuccin/palette, MIT License, Copyright (c) 2021 Catppuccin).
# "High contrast" is CodeShellManager's own: white text on black, with bright accents.
#
# Every colour is optional: a missing one is the base theme's (Mocha for "dark", Latte for
# "light"). Edit this file while the add-on is enabled and the window follows within a second.

[addon]
id = "themes"
name = "Themes"
version = "0.1.0"
description = "Catppuccin Frappé and Macchiato, and a high-contrast dark theme."
api = 1
kind = "pack"
author = "CodeShellManager samples"
homepage = "https://github.com/catppuccin/palette"

[[theme]]
id = "frappe"
name = "Catppuccin Frappé"
base = "dark"
description = "Catppuccin's softer dark flavour (MIT, catppuccin/palette)."

[theme.colors]
rosewater = "#f2d5cf"
flamingo = "#eebebe"
pink = "#f4b8e4"
mauve = "#ca9ee6"
red = "#e78284"
maroon = "#ea999c"
peach = "#ef9f76"
yellow = "#e5c890"
green = "#a6d189"
teal = "#81c8be"
sky = "#99d1db"
sapphire = "#85c1dc"
blue = "#8caaee"
lavender = "#babbf1"
text = "#c6d0f5"
subtext1 = "#b5bfe2"
subtext0 = "#a5adce"
overlay2 = "#949cbb"
overlay1 = "#838ba7"
overlay0 = "#737994"
surface2 = "#626880"
surface1 = "#51576d"
surface0 = "#414559"
base = "#303446"
mantle = "#292c3c"
crust = "#232634"

[[theme]]
