# Sample add-on: three colour themes for fun, nothing else (no programs, no commands).
#
# Shipped with CodeShellManager under <install dir>\samples\addons\. Settings > Add-ons >
# "Install samples" copies it into your add-ons folder; it stays off until you Enable it. Then
# Settings > Appearance lists its themes: the dark ones under Dark theme, the light ones under
# Light theme. See docs/addons.md, "Themes".
#
# All three are original palettes, inspired by old machines and programs, not copies of any
# third-party theme file:
# - "Emacs": the classic dark look of GNU Emacs' font-lock faces (wheat text, cyan keywords,
#   firebrick comments, aquamarine constants, a grey modeline and a violet accent).
# - "Windows 98": the 3D-face grey, white fields, navy title and selection, teal desktop, and the
#   16-colour VGA palette for the terminal. The terminal is light, so the bright ANSI colours that
#   vanish on white are darkened a little (noted beside them); the rest are the VGA values.
# - "Blossom": blush, lavender, peach and mint on a creamy pink, with plum text.
#
# Every colour is optional: a missing one is the base theme's (Mocha for "dark", Latte for
# "light"). Edit this file while the add-on is enabled and the window follows within a second.

[addon]
id = "theme-fun"
name = "Fun themes"
version = "0.1.0"
description = "Emacs (dark), Windows 98 and Blossom (light): original colour themes."
api = 1
kind = "pack"
author = "CodeShellManager samples"

[[theme]]
id = "emacs"
name = "Emacs"
base = "dark"
description = "Classic dark Emacs font-lock colours on a charcoal background."

[theme.style]
corners = "square"
borders = "flat"
ui_font = "mono"           # JetBrains Mono for the whole UI
[theme.style.titlebar]
background = "#3c3c3c"    # the modeline grey
text = "#f5deb3"
inactive_background = "#2e2e2e"
inactive_text = "#9a9a9a"

[theme.colors]
rosewater = "#ffdab9"   # peach puff
flamingo = "#ffa07a"    # light salmon
pink = "#ff8bd1"
mauve = "#c586ff"       # the violet accent
red = "#ff6c6b"
maroon = "#b22222"      # firebrick (comments are dim too)
peach = "#f4a460"       # sandy brown
yellow = "#eedc82"      # light goldenrod
green = "#98fb98"       # pale green (types)
teal = "#7fffd4"        # aquamarine (constants)
sky = "#87cefa"         # light sky blue (function names)
sapphire = "#4fb8ff"    # keywords
blue = "#56b6ff"
lavender = "#b0c4de"    # light steel blue
text = "#f5deb3"        # wheat
subtext1 = "#dcc79f"
subtext0 = "#bfae88"
overlay2 = "#9a9a9a"
overlay1 = "#7a7a7a"
overlay0 = "#666666"
surface2 = "#4f4f4f"
surface1 = "#3c3c3c"    # modeline grey
surface0 = "#2e2e2e"
base = "#1e1e1e"
mantle = "#181818"
crust = "#111111"

[theme.terminal]
foreground = "#f5deb3"
background = "#1e1e1e"
cursor = "#f5deb3"
selection = "#3a4a6b"
black = "#2b2b2b"
red = "#ff6c6b"
green = "#98fb98"
yellow = "#eedc82"
blue = "#56b6ff"
magenta = "#c586ff"
cyan = "#7fffd4"
white = "#d8c59c"
bright_black = "#6a6a6a"
bright_red = "#ff8a80"
bright_green = "#b9f5b9"
bright_yellow = "#ffe98a"
bright_blue = "#8fd0ff"
bright_magenta = "#dcaaff"
bright_cyan = "#b0ffe6"
bright_white = "#f5deb3"

