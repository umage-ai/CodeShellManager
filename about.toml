# cargo-about config: builds the third-party licence bundle shipped with releases (the MSI/ZIP).
#   cargo about generate about.hbs -o THIRD-PARTY-LICENSES.html
# Keep `accepted` in step with deny.toml.
accepted = [
    "MIT",
    "MIT-0",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "0BSD",
    "Unicode-3.0",
    "BSL-1.0",
    "CC0-1.0",
    "Unlicense",
    "CDLA-Permissive-2.0",
    "OFL-1.1",
    "Ubuntu-font-1.0",
    "MPL-2.0", # only option-ext; deny.toml enforces that
]
# Bundle only what ships: skip dev-dependencies, keep build dependencies out of the list too.
ignore-dev-dependencies = true
ignore-build-dependencies = true
workarounds = ["ring"]
