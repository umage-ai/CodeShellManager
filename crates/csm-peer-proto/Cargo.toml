[package]
name = "csm-peer-proto"
description = "Pure wire protocol of CodeShellManager's peer link: owned snapshot and event DTOs, framing, the message set, Noise parameters, pairing, test vectors. No engine, no egui, no I/O."
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
base64 = "0.22"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"

[dev-dependencies]
snow = "0.10"
