[package]
name = "csm-engine"
description = "Session supervisor and the tool registry: every action is a tool, dispatched by id from UI, CLI and MCP"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
csm-core = { path = "../csm-core" }
csm-pty = { path = "../csm-pty" }
csm-term = { path = "../csm-term" }
csm-services = { path = "../csm-services" }
csm-index = { path = "../csm-index" }
log = "0.4"
# POSIX word splitting for Unix shell sessions (launch.rs).
shlex = "1.3"
dirs = "6"
uuid = { version = "1", features = ["v4"] }
# Local dates for the usage periods (chrono, used before, is RUSTSEC-2026-0543 unmaintained).
jiff = "0.2"
serde = { version = "1", features = ["derive", "rc"] }
serde_json = "1"
serde_path_to_error = "0.1"
schemars = "1"
bitflags = { version = "2", features = ["serde"] }
thiserror = "2"

[dev-dependencies]
tempfile = "3"
rusqlite = { version = "0.43", features = ["bundled"] }

# Test helper: a process add-on for the plugin host's tests (tests/plugins.rs). Not shipped.
[[bin]]
name = "csm-echo-plugin"
path = "tests/support/echo_plugin.rs"
test = false
doc = false
