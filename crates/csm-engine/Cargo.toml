[package]
name = "csm-engine"
description = "Session supervisor and the tool registry: every action is a tool, dispatched by id from UI, CLI and MCP"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
csm-core = { path = "../csm-core" }
csm-pty = { path = "../csm-pty" }
csm-term = { path = "../csm-term" }
csm-services = { path = "../csm-services" }
log = "0.4"
dirs = "6"
uuid = { version = "1", features = ["v4"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_path_to_error = "0.1"
schemars = "1"
bitflags = { version = "2", features = ["serde"] }
thiserror = "2"

[dev-dependencies]
tempfile = "3"
