[package]
name = "csm-services"
description = "CodeShellManager services: argv quoting, git parsing, Open-with rules (pure parts first)"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish.workspace = true

[lints]
workspace = true

[lib]
path = "src/lib.rs"

# Test helper only: prints its argv so tests can compare a real process's view of a command
# line with our quoting. Not shipped; see tests/real_process_argv.rs.
[[bin]]
name = "csm-argv-echo"
path = "src/bin/csm-argv-echo.rs"
test = false
doc = false

[dependencies]
csm-core = { path = "../csm-core" }
# vswhere's JSON (Open with detection).
serde = { version = "1", features = ["derive"] }
serde_json = "1"
log = "0.4"
notify = "8"
sha2 = "0.10"
# The OS keychain, for add-ons that keep secrets of their own (secrets.rs). Pure Rust on every OS:
# Credential Manager, Keychain, and the Secret Service over zbus (no libdbus to install).
keyring = "4"
two-face = { version = "0.5.2", default-features = false, features = ["syntect-fancy"] }
syntect = { version = "5", default-features = false, features = ["parsing", "regex-fancy"] }

[dev-dependencies]
tempfile = "3"
