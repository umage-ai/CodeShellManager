[package]
name = "csm-remote"
description = "The remote window's client: RemoteBackend (a Backend and ToolPort over a paired host), its terminals and the connection worker"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
csm-core = { path = "../csm-core" }
csm-engine = { path = "../csm-engine" }
csm-peer = { path = "../csm-peer" }
csm-peer-proto = { path = "../csm-peer-proto" }
csm-term = { path = "../csm-term" }
csm-ui = { path = "../csm-ui" }
arboard = "3"
image = { version = "0.25", default-features = false, features = ["png"] }
log = "0.4"
sha2 = "0.10"
serde_json = "1"

[dev-dependencies]
csm-peer = { path = "../csm-peer", features = ["test-knobs"] }
csm-pty = { path = "../csm-pty" }
tempfile = "3"
