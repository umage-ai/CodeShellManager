[package]
name = "csm-remote-proto"
description = "Pure wire protocol of the CSM phone remote: relay frames, Noise parameters, pairing payload, phone/add-on messages, test vectors."
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
base64 = "0.22"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"

[dev-dependencies]
snow = "0.10"
