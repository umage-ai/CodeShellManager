[package]
name = "xtask"
description = "Repository checks: layers, source policy, tool catalogue, secrets, CI. Run as `cargo xtask <command>`."
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
csm-engine = { path = "../crates/csm-engine" }
csm-mcp = { path = "../crates/csm-mcp" }
serde_json = "1"
syn = { version = "2", default-features = false, features = ["full", "visit", "parsing", "printing", "clone-impls", "proc-macro"] }
proc-macro2 = { version = "1", features = ["span-locations"] }
