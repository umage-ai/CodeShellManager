[package]
name = "csm-phone"
description = "Phone remote add-on (host side): pairs phones over an outbound relay connection, runs their fixed ops as CSM tools, end to end encrypted with Noise."
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish.workspace = true

[lints]
workspace = true

[lib]
name = "csm_phone"
path = "src/lib.rs"

[[bin]]
name = "csm-phone"
path = "src/main.rs"

[dependencies]
csm-remote-proto = { path = "../../crates/csm-remote-proto" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
snow = "0.10"
getrandom = "0.3"
tungstenite = { version = "0.29", features = ["rustls-tls-webpki-roots"] }
# TLS for wss://: the ring provider is named in code (no process-wide default), with the public
# roots bundled in webpki-roots. Both are already in the lock file.
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
webpki-roots = "1"
# Web Push body encryption (RFC 8291). Already in the lock file through other crates.
p256 = { version = "0.14", features = ["ecdh"] }
hkdf = "0.13"
sha2 = "0.11"
aes-gcm = "0.10"

[dev-dependencies]
tempfile = "3"
toml = "1"
