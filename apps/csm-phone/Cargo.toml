[package]
name = "csm-phone"
description = "Phone remote add-on (host side): pairs phones over an outbound relay connection, runs their fixed ops as CSM tools, end to end encrypted with Noise."
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish.workspace = true

[lints]
workspace = true

[lib]
name = "csm_phone"
path = "src/lib.rs"

[[bin]]
name = "csm-phone"
path = "src/main.rs"

[dependencies]
csm-remote-proto = { path = "../../crates/csm-remote-proto" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
snow = "0.10"
getrandom = "0.3"
tungstenite = "0.29"

[dev-dependencies]
tempfile = "3"
