[package]
name = "codeshell"
description = "CodeShellManager desktop app"
build = "build.rs"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
