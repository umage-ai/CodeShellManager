[package]
name = "csm-phone-it"
description = "Integration tests for the phone remote: the add-on's host and the real csm-relay on 127.0.0.1, driven by a Rust test phone. No code ships from this crate."
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish.workspace = true

[lints]
workspace = true

[lib]
name = "csm_phone_it"
path = "src/lib.rs"

[dev-dependencies]
csm-relay = { path = "../../relay" }
csm-phone = { path = "../csm-phone" }
csm-remote-proto = { path = "../../crates/csm-remote-proto" }
serde_json = "1"
snow = "0.10"
tempfile = "3"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "time", "sync"] }
tungstenite = "0.29"
