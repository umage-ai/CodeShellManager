[package]
name = "csm-review"
description = "Review add-on: view changes and files read-only, comment on lines, agents reply (a process add-on with screens)"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish.workspace = true

[lints]
workspace = true

[lib]
name = "csm_review"
path = "src/lib.rs"

[[bin]]
name = "csm-review"
path = "src/main.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"

[dev-dependencies]
csm-core = { path = "../../crates/csm-core" }
csm-engine = { path = "../../crates/csm-engine" }
csm-pty = { path = "../../crates/csm-pty" }
tempfile = "3"
