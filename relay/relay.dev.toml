# csm-relay for local development and the end-to-end test only. Loopback, admits every host, no push.
# Never deploy this file: relay/relay.example.toml is the starting point for a real relay.
#
#   cargo run -p csm-relay -- --config relay/relay.dev.toml
#
# Then set the add-on's relay to ws://127.0.0.1:8787 and its app_origin to http://127.0.0.1:8080
# (node phone/tools/serve.mjs serves the phone app there). See docs/phone-remote.md.

bind = "127.0.0.1:8787"

[access]
# Open: any host may connect. This is why the file must stay on loopback.
open = true

[push]
# Off: the relay answers pushes with push_refused and calls no push service.
enabled = false
