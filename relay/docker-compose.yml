# Relay + Caddy (automatic TLS). From the repository root:
#
#   cp relay/relay.example.toml relay/relay.toml     # then edit: at least [access]
#   docker compose -f relay/docker-compose.yml up -d --build
#
# Only Caddy publishes ports; the relay is reachable from Caddy alone, which is what makes
# trust_forwarded_for safe.
services:
  relay:
    build:
      context: ..
      dockerfile: relay/Dockerfile
    restart: unless-stopped
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    environment:
      CSM_RELAY_CONFIG: /etc/csm-relay/relay.toml
      CSM_RELAY_TRUST_FORWARDED_FOR: "1"
    volumes:
      - ./relay.toml:/etc/csm-relay/relay.toml:ro
      - relay-data:/data
    expose: ["8787"]

  caddy:
    image: caddy:2
    restart: unless-stopped
    depends_on: [relay]
    ports: ["80:80", "443:443"]
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config

volumes:
  relay-data:
  caddy-data:
  caddy-config:
