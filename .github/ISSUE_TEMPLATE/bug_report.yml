name: Bug report
description: Something is broken or behaving wrong
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to file a bug. The more concrete the repro, the faster it gets fixed.

        Please first check the [open issues](https://github.com/umage-ai/CodeShellManager/issues?q=is%3Aissue) to see if it's already reported.

  - type: textarea
    id: description
    attributes:
      label: Description
      description: What happened, in one paragraph.
    validations:
      required: true

  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      description: Minimal numbered steps that hit the bug from a clean state. If the `--clean` flag changes the outcome, please mention.
      placeholder: |
        1. Launch CodeShellManager
        2. ...
        3. ...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected vs actual behaviour
      description: What you expected to see, and what you actually saw.
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: CodeShellManager version
      description: From Settings → About, or the installer file name (e.g. `2.0.0`).
      placeholder: 2.0.0
    validations:
      required: true

  - type: input
    id: os
    attributes:
      label: Operating system
      description: On Windows, run `winver` and paste the version (e.g. `Windows 11 24H2 build 26200`).
    validations:
      required: true

  - type: input
    id: cli
    attributes:
      label: CLI tool and version
      description: If the bug involves a specific CLI hosted in a session (claude, codex, pwsh, ssh, etc.), give the tool name and version.
      placeholder: claude 2.1.0

  - type: textarea
    id: doctor
    attributes:
      label: csm doctor output
      description: |
        Run `csm doctor` in a terminal and paste the output. It checks the install, the bundled ConPTY and the MCP server.
        The Diagnostics section of Settings → About (ConPTY in use, sessions) helps too.
      render: text

  - type: textarea
    id: extra
    attributes:
      label: Anything else
      description: Screenshots, screen recordings, a sanitised `state.json` or `.csm` export, whatever helps.
