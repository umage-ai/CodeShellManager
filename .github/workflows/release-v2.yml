name: Release (Windows)

# CodeShellManager (version 2, the Rust app): build, sign and package the Windows release.
# Linux and macOS packages are built by their own workflow file; this one is Windows only.
# docs/release.md is the checklist and explains every identity the installer carries.
#
# Two install channels (installer/CodeShellManager2.wxs):
#
#   - stable: THE CodeShellManager. The MSI carries the WPF app's UpgradeCode, name and folder,
#     so it major-upgrades an installed WPF CodeShellManager (0.x) in place, and removes a
#     CodeShellManager Beta install. Release candidates and final releases use it.
#   - beta:   "CodeShellManager Beta", installed BESIDE the WPF app (its own UpgradeCode,
#     folder and app id). `-beta.N` tags use it.
#
# Triggers:
#   - A tag `vMAJOR.MINOR.PATCH[-beta.N|-rc.N]` with MAJOR >= 2 (v2.0.0-beta.4, v2.0.0-rc.1,
#     v2.0.0): signed exes, a signed MSI and a portable zip, published as a GitHub release: a
#     PRE-release for -beta/-rc, otherwise a normal release marked "latest" (what the WPF app's
#     update check reads, and what winget.yml / chocolatey.yml publish). Tags are created by
#     hand, and only when Allan says so (see CLAUDE.md, "Releases").
#   - workflow_dispatch: a dry run. Same build and packaging for the chosen channel, unsigned,
#     uploaded as a workflow artifact; no release is created.
#
# A tag runs the workflow files of the commit it points at, so a v2 tag on a v2 commit never
# runs the WPF app's build.yml (which main keeps until v2 is merged into it).
#
# Until v2 is merged, a copy of this file sits on main (the WPF line) only because GitHub
# dispatches a workflow only if it exists on the default branch. Run it with `--ref v2`.
#
# Signing uses the repo's Azure Trusted Signing secrets (same names as the WPF release):
#   AZURE_TENANT_ID, AZURE_CLIENT_ID, AZURE_CLIENT_SECRET,
#   AZURE_SIGNING_ENDPOINT, AZURE_SIGNING_ACCOUNT, AZURE_SIGNING_PROFILE
# A stable-channel tag refuses to publish unsigned.

on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:
    inputs:
      channel:
        description: 'Install channel of the dry-run MSI (stable upgrades an installed WPF CodeShellManager)'
        required: true
        default: beta
        type: choice
        options: [beta, stable]

permissions:
  contents: write   # create the GitHub Release

env:
  CARGO_TERM_COLOR: always

jobs:
  release:
    # A tag (the Versions step refuses anything below 2.0.0), or a dry run from v2 or main.
    if: startsWith(github.ref, 'refs/tags/v') || github.ref == 'refs/heads/v2' || github.ref == 'refs/heads/main'
    runs-on: windows-latest
    env:
      HAS_SIGNING: ${{ secrets.AZURE_TENANT_ID != '' }}
      IS_TAG: ${{ startsWith(github.ref, 'refs/tags/v') }}
    steps:
      - uses: actions/checkout@v7

      # The gate's toolchain (see ci.yml).
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.97"

      - uses: Swatinem/rust-cache@v2

      # ── Versions and channel ────────────────────────────────────────────────
      # semver (Cargo, file names, winget, Chocolatey): 2.0.0-beta.3, 2.0.0-rc.1, 2.0.0
      # MSI ProductVersion must be numeric. Pre-releases: 2.0.0.N (beta.N -> N, rc.N -> 100+N,
      # dev -> 0). A final release is exactly MAJOR.MINOR.PATCH, as the WPF app's MSIs were, so
      # Add/Remove Programs shows the version winget and Chocolatey publish. MSI compares only
      # the first three fields, so MajorUpgrade allows same-version upgrades.
      # Channel: -beta.N -> beta; -rc.N and final -> stable; a dry run -> the chosen input.
      - name: Versions
        id: ver
        shell: pwsh
        env:
          DISPATCH_CHANNEL: ${{ inputs.channel }}
        run: |
          if ($env:IS_TAG -eq 'true') { $semver = '${{ github.ref_name }}'.TrimStart('v') }
          else { $semver = "2.0.0-dev.${{ github.run_number }}" }
          if ($semver -notmatch '^(\d+)\.(\d+)\.(\d+)(?:-(beta|rc|dev)\.(\d+))?$') {
            throw "Tag version '$semver' is not MAJOR.MINOR.PATCH[-beta.N|-rc.N]"
          }
          if ([int]$Matches[1] -lt 2) { throw "Tag version '$semver' is below 2.0.0: the WPF app's tags are not built here" }
          $base = "$($Matches[1]).$($Matches[2]).$($Matches[3])"
          $kind = $Matches[4]
          $msi = switch ($kind) { 'beta' { "$base.$([int]$Matches[5])" } 'rc' { "$base.$(100 + [int]$Matches[5])" } 'dev' { "$base.0" } default { $base } }
          $channel = switch ($kind) { 'beta' { 'beta' } 'dev' { $env:DISPATCH_CHANNEL } default { 'stable' } }
          if ($channel -notin 'beta', 'stable') { throw "unknown channel '$channel'" }
          $aumid = if ($channel -eq 'stable') { 'UmageAI.CodeShellManager' } else { 'UmageAI.CodeShellManager.Beta' }
          $prerelease = if ($kind) { 'true' } else { 'false' }
          "semver=$semver"         | Out-File $env:GITHUB_OUTPUT -Append
          "msi=$msi"               | Out-File $env:GITHUB_OUTPUT -Append
          "channel=$channel"       | Out-File $env:GITHUB_OUTPUT -Append
          "aumid=$aumid"           | Out-File $env:GITHUB_OUTPUT -Append
          "prerelease=$prerelease" | Out-File $env:GITHUB_OUTPUT -Append
          Write-Host "semver $semver, MSI $msi, channel $channel, pre-release $prerelease"

      # A stable build goes to winget and Chocolatey and replaces the signed WPF app on people's
      # machines: never unsigned.
      - name: Refuse an unsigned stable release
        if: env.IS_TAG == 'true' && steps.ver.outputs.channel == 'stable' && env.HAS_SIGNING != 'true'
        shell: pwsh
        run: throw 'A stable-channel tag needs the Azure Trusted Signing secrets; none are set.'

      # The exe reports the release's version (About, `csm app-info`).
      - name: Stamp the workspace version
        shell: pwsh
        run: |
          $toml = Get-Content Cargo.toml -Raw
          $new = [regex]::Replace($toml, '(?m)^version = "[^"]*"', 'version = "${{ steps.ver.outputs.semver }}"', 1)
          if ($new -eq $toml) { throw 'workspace version line not found in Cargo.toml' }
          Set-Content Cargo.toml $new -NoNewline

      - name: Bundled ConPTY
        shell: pwsh
        run: ./scripts/get-conpty.ps1

      # The channel is compiled in (csm_core::channel): a beta has its own data folders
      # (CodeShellManager2-Beta) and IPC app id (codeshell-beta). Unset means stable.
      - name: Build
        env:
          CSM_CHANNEL: ${{ steps.ver.outputs.channel }}
        run: cargo build --release -p codeshell -p csm-cli -p csm-session-summary -p csm-review -p csm-legacy-launcher

      # The third-party licence bundle (about.toml / about.hbs), shipped beside the exes in the
      # MSI and the zip. It fails on a licence about.toml does not accept.
      - name: Install cargo-about
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-about

      - name: Third-party licences
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force publish | Out-Null
          # The command about.toml documents (the whole workspace: a superset of what ships).
          cargo about generate about.hbs -o publish/THIRD-PARTY-LICENSES.html
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      # ── Stage the files the MSI and the zip ship ─────────────────────────────
      # The stable channel replaces the WPF app (0.x), whose exe was CodeShellManager.exe in the same
      # folder, so it also ships CodeShellManager.exe: a tiny launcher (apps/csm-legacy-launcher)
      # that starts codeshell.exe beside it, so taskbar pins, shortcuts and scripts that name the
      # old exe keep working (docs/release.md). A beta folder never held 0.x: no launcher there.
      - name: Stage
        id: stage
        shell: pwsh
        env:
          CHANNEL: ${{ steps.ver.outputs.channel }}
        run: |
          New-Item -ItemType Directory -Force publish, dist | Out-Null
          # Our own exes: these are signed and verified.
          $ours = @('codeshell.exe', 'csm.exe', 'csm-session-summary.exe', 'csm-review.exe')
          if ($env:CHANNEL -eq 'stable') { $ours += 'CodeShellManager.exe' }
          foreach ($f in $ours + @('conpty.dll', 'OpenConsole.exe')) {
            $p = "target/release/$f"
            if (-not (Test-Path $p)) { throw "missing from the build: $f" }
            Copy-Item $p publish/
          }
          # Sample add-ons (disabled until the person installs and enables them). They sit under
          # samples/addons beside the exes: the app copies them on "Install samples".
          $samples = @('codex-cli', 'gemini-cli', 'review', 'session-summary', 'themes')
          foreach ($s in $samples) {
            New-Item -ItemType Directory -Force "publish/samples/addons/$s" | Out-Null
            Copy-Item "samples/addons/$s/addon.toml" "publish/samples/addons/$s/"
          }
          # The bundled ConPTY must be Microsoft's, unmodified (it is never re-signed by us).
          foreach ($f in 'conpty.dll', 'OpenConsole.exe') {
            $sig = Get-AuthenticodeSignature "publish/$f"
            if ($sig.Status -ne 'Valid' -or $sig.SignerCertificate.Subject -notlike '*O=Microsoft Corporation*') {
              throw "Bundled ConPTY file $f is not validly Microsoft-signed ($($sig.Status))."
            }
          }
          # The app must be a GUI program (no console window opens with it) and the CLI a console
          # program (its output must reach the terminal). The sample plugin is a console program too
          # (it talks over stdin/stdout pipes); the plugin host starts it with CREATE_NO_WINDOW, so
          # no window flashes. PE optional header field Subsystem: 2 = Windows GUI, 3 = console.
          # The 0.x-name launcher is a GUI program too: no console window flashes from a pin.
          $subsystems = @(@('codeshell.exe', 2), @('csm.exe', 3), @('csm-session-summary.exe', 3), @('csm-review.exe', 3))
          if ($ours -contains 'CodeShellManager.exe') { $subsystems += , @('CodeShellManager.exe', 2) }
          foreach ($pair in $subsystems) {
            $b = [System.IO.File]::ReadAllBytes("publish/$($pair[0])")
            $pe = [BitConverter]::ToInt32($b, 0x3C)
            $subsystem = [BitConverter]::ToUInt16($b, $pe + 24 + 68)
            if ($subsystem -ne $pair[1]) { throw "$($pair[0]) has PE subsystem $subsystem, expected $($pair[1])" }
          }
          # Every staged file must be in the installer (a file left out ships only in the zip).
          $wxs = Get-Content installer/CodeShellManager2.wxs -Raw
          $staged = $ours + @('conpty.dll', 'OpenConsole.exe', 'codeshell.aumid', 'THIRD-PARTY-LICENSES.html')
          foreach ($s in $samples) { $staged += "samples\addons\$s\addon.toml" }
          foreach ($f in $staged) {
            if ($wxs -notmatch [regex]::Escape("`$(var.PublishDir)\$f")) { throw "installer/CodeShellManager2.wxs does not install $f" }
          }
          # And nothing under publish/samples may be missing from the list above.
          $onDisk = Get-ChildItem publish/samples -Recurse -File | ForEach-Object { $_.FullName.Substring((Resolve-Path publish).Path.Length + 1) }
          foreach ($f in $onDisk) { if ($staged -notcontains $f) { throw "staged $f is not in the installer coverage list" } }
          # What the signing and verifying steps take: our exes only.
          "sign_files=$(($ours | ForEach-Object { "$env:GITHUB_WORKSPACE\publish\$_" }) -join ',')" | Out-File $env:GITHUB_OUTPUT -Append
          "sign_names=$($ours -join ',')" | Out-File $env:GITHUB_OUTPUT -Append

      # OUR exes only, by name: publish/ also holds Microsoft's OpenConsole.exe and conpty.dll.
      - name: Sign executables (Azure Trusted Signing)
        if: env.IS_TAG == 'true' && env.HAS_SIGNING == 'true'
        uses: azure/trusted-signing-action@v2.0.0
        with:
          azure-tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          azure-client-id: ${{ secrets.AZURE_CLIENT_ID }}
          azure-client-secret: ${{ secrets.AZURE_CLIENT_SECRET }}
          endpoint: ${{ secrets.AZURE_SIGNING_ENDPOINT }}
          trusted-signing-account-name: ${{ secrets.AZURE_SIGNING_ACCOUNT }}
          certificate-profile-name: ${{ secrets.AZURE_SIGNING_PROFILE }}
          files: ${{ steps.stage.outputs.sign_files }}
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256

      # ── Portable zip (no codeshell.aumid: a portable copy has no Start-menu shortcut) ──
      - name: Portable zip
        shell: pwsh
        run: |
          Compress-Archive -Path publish\* -DestinationPath "dist/CodeShellManager-${{ steps.ver.outputs.semver }}-win-x64.zip"

      # ── MSI ─────────────────────────────────────────────────────────────────
      - name: Install WiX toolset v4 (last open-source release)
        shell: pwsh
        run: |
          dotnet tool install --global wix --version "4.0.5"
          wix extension add --global WixToolset.UI.wixext/4.0.5

      - name: Build MSI
        shell: pwsh
        run: |
          # Must match AppUserModelId in the .wxs.
          Set-Content publish/codeshell.aumid '${{ steps.ver.outputs.aumid }}' -NoNewline
          wix build installer/CodeShellManager2.wxs `
            -d Version=${{ steps.ver.outputs.msi }} `
            -d PublishDir=publish `
            -d Channel=${{ steps.ver.outputs.channel }} `
            -ext WixToolset.UI.wixext `
            -arch x64 `
            -o "dist/CodeShellManager-${{ steps.ver.outputs.semver }}-Setup.msi"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Sign MSI (Azure Trusted Signing)
        if: env.IS_TAG == 'true' && env.HAS_SIGNING == 'true'
        uses: azure/trusted-signing-action@v2.0.0
        with:
          azure-tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          azure-client-id: ${{ secrets.AZURE_CLIENT_ID }}
          azure-client-secret: ${{ secrets.AZURE_CLIENT_SECRET }}
          endpoint: ${{ secrets.AZURE_SIGNING_ENDPOINT }}
          trusted-signing-account-name: ${{ secrets.AZURE_SIGNING_ACCOUNT }}
          certificate-profile-name: ${{ secrets.AZURE_SIGNING_PROFILE }}
          files-folder: dist
          files-folder-filter: msi
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256

      # Our exes and the MSI must carry a valid signature before anything is published.
      - name: Verify signatures
        if: env.IS_TAG == 'true' && env.HAS_SIGNING == 'true'
        shell: pwsh
        env:
          SIGN_NAMES: ${{ steps.stage.outputs.sign_names }}
        run: |
          $files = @($env:SIGN_NAMES -split ',' | ForEach-Object { "publish/$_" })
          $files += @(Get-ChildItem dist/*.msi | ForEach-Object FullName)
          foreach ($f in $files) {
            $sig = Get-AuthenticodeSignature $f
            if ($sig.Status -ne 'Valid') { throw "$f is not validly signed ($($sig.Status))" }
            Write-Host "$f signed by $($sig.SignerCertificate.Subject)"
          }

      # ── Publish ─────────────────────────────────────────────────────────────
      - name: Upload packages (dry run)
        if: env.IS_TAG != 'true'
        uses: actions/upload-artifact@v7
        with:
          name: codeshellmanager-${{ steps.ver.outputs.semver }}
          path: dist/*

      # A final release is a normal release and becomes "latest": the WPF app's update check
      # (releases/latest) then offers it, and winget.yml / chocolatey.yml take its MSI.
      - name: Create GitHub release
        if: env.IS_TAG == 'true'
        uses: softprops/action-gh-release@v2
        with:
          prerelease: ${{ steps.ver.outputs.prerelease == 'true' }}
          make_latest: ${{ steps.ver.outputs.prerelease == 'true' && 'false' || 'true' }}
          name: CodeShellManager ${{ steps.ver.outputs.semver }}
          generate_release_notes: true
          files: |
            dist/*.msi
            dist/*.zip
