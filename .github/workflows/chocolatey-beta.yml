name: Publish beta to Chocolatey

# Packs the signed MSI from a v2 GitHub pre-release as the Chocolatey package
# `codeshellmanager-beta` (beside `codeshellmanager`, the WPF 1.x package) and pushes it.
#
# DISPATCH ONLY, and only when Allan says so (CLAUDE.md, "Releases"):
#
#     gh workflow run chocolatey-beta.yml --ref v2 -f tag=v2.0.0-beta.N
#
# With push=false it only packs and uploads the .nupkg as a workflow artifact.
#
# Version: Chocolatey's community repository takes SemVer 1 pre-release labels, so
# 2.0.0-beta.3 is packed as 2.0.0-beta0003 (zero-padded so beta0010 sorts after beta0009).
#
# Needs repo secret CHOCO_API_KEY, allowed to push package id `codeshellmanager-beta`.

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'v2 pre-release tag to publish (e.g. v2.0.0-beta.1)'
        required: true
        type: string
      push:
        description: 'Push to community.chocolatey.org (false = pack only)'
        required: true
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  publish:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Resolve tag and versions
        id: ver
        shell: pwsh
        run: |
          $tag = '${{ inputs.tag }}'
          $semver = $tag.TrimStart('v')
          if ($semver -notmatch '^(2\.\d+\.\d+)(?:-(beta|rc)\.(\d+))?$') { throw "Not a v2 release tag: $tag" }
          $choco = if ($Matches[2]) { '{0}-{1}{2:D4}' -f $Matches[1], $Matches[2], [int]$Matches[3] } else { $Matches[1] }
          "tag=$tag"       | Out-File $env:GITHUB_OUTPUT -Append
          "semver=$semver" | Out-File $env:GITHUB_OUTPUT -Append
          "choco=$choco"   | Out-File $env:GITHUB_OUTPUT -Append
          Write-Host "tag $tag, package version $choco"

      - name: Download signed MSI from the GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $msiName = "CodeShellManager-${{ steps.ver.outputs.semver }}-Setup.msi"
          New-Item -ItemType Directory -Force -Path artifact | Out-Null
          gh release download '${{ steps.ver.outputs.tag }}' --repo ${{ github.repository }} --pattern $msiName --dir artifact
          if (-not (Test-Path "artifact\$msiName")) { throw "MSI $msiName not found in release ${{ steps.ver.outputs.tag }}." }
          $sig = Get-AuthenticodeSignature "artifact\$msiName"
          if ($sig.Status -ne 'Valid') { throw "MSI $msiName is not validly signed ($($sig.Status)); refusing to package it." }

      - name: Template version, URL and checksum into the package
        shell: pwsh
        run: |
          $msiName = "CodeShellManager-${{ steps.ver.outputs.semver }}-Setup.msi"
          $url64   = "https://github.com/${{ github.repository }}/releases/download/${{ steps.ver.outputs.tag }}/$msiName"
          $sha256  = (Get-FileHash "artifact\$msiName" -Algorithm SHA256).Hash.ToLowerInvariant()
          $install = '.chocolatey/tools/chocolateyinstall.ps1'
          (Get-Content $install -Raw).Replace('__URL64__', $url64).Replace('__CHECKSUM64__', $sha256) | Set-Content $install -NoNewline
          $nuspec = '.chocolatey/codeshellmanager-beta.nuspec'
          (Get-Content $nuspec -Raw).Replace('__VERSION__', '${{ steps.ver.outputs.choco }}').Replace('__TAG__', '${{ steps.ver.outputs.tag }}') | Set-Content $nuspec -NoNewline
          Get-Content $install; Get-Content $nuspec

      - name: choco pack
        shell: pwsh
        run: |
          choco pack .chocolatey/codeshellmanager-beta.nuspec --out artifact
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Upload the nupkg
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: codeshellmanager-beta-chocolatey-${{ steps.ver.outputs.choco }}
          path: artifact/*.nupkg
          if-no-files-found: warn

      - name: choco push
        if: inputs.push
        shell: pwsh
        env:
          CHOCO_API_KEY: ${{ secrets.CHOCO_API_KEY }}
        run: |
          $nupkg = "artifact/codeshellmanager-beta.${{ steps.ver.outputs.choco }}.nupkg"
          if (-not (Test-Path $nupkg)) { throw "Expected nupkg not found: $nupkg" }
          choco push $nupkg --source https://push.chocolatey.org/ --api-key $env:CHOCO_API_KEY
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
