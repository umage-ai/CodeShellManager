name: CI

# Runs only when asked: a push to v2 runs nothing (every v2 commit already passed the local gate
# on Windows). To check the other platforms, push v2 to a ci branch:
#   git push -f origin v2:ci/check        Linux only (cheap)
#   git push -f origin v2:ci-full/check   Windows, macOS and Linux (before a release; macOS
#                                         minutes cost about 10x Linux)
# The workflow file is not on main, so "Run workflow" (workflow_dispatch) is not offered.
on:
  push:
    branches: ['ci/**', 'ci-full/**']

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: build, test, clippy (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(startsWith(github.ref_name, 'ci-full/') && '["windows-latest", "macos-latest", "ubuntu-latest"]' || '["ubuntu-latest"]') }}
    steps:
      - uses: actions/checkout@v7

      # The same toolchain as the local gate (cargo +1.97, rust-version in Cargo.toml): a newer
      # stable brings new clippy lints that would fail CI but not the gate. Bump both together.
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.97"
          components: clippy

      - uses: Swatinem/rust-cache@v2

      # egui / winit / wgpu need these to compile and link on Linux.
      - name: Linux system libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libxkbcommon-dev libwayland-dev libx11-dev libxrandr-dev libxi-dev libgl1-mesa-dev libgtk-3-dev

      # The bundled ConPTY (conpty.dll + OpenConsole.exe, Microsoft-signed) is fetched, never
      # committed. Without it the app and the tests fall back to the inbox ConPTY.
      - name: Bundled ConPTY
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/get-conpty.ps1

      - name: Build
        run: cargo build --workspace --all-targets

      - name: Test
        run: cargo test --workspace

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      # Layers, source policy, the generated tool catalogue and secrets. Clippy and the tests ran
      # above, so skip them here.
      - name: xtask ci
        run: cargo xtask ci --skip-cargo

  deny:
    name: cargo-deny
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check
