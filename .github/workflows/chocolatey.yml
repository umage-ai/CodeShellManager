name: Publish to Chocolatey

# Packs and pushes a Chocolatey package wrapping the signed MSI from a GitHub Release
# to community.chocolatey.org, as package `codeshellmanager` (the WPF app's id). Version 2's
# stable MSI carries the WPF app's UpgradeCode, so `choco upgrade codeshellmanager` replaces
# the WPF app in place (docs/release.md). Final releases of 2.0.0 or later only.
#
# The package files (.chocolatey/) are taken from the release's tag, not from the branch the
# workflow was dispatched on, so the package always matches the installer it wraps.
#
# ⚠️ The `release` trigger below has never actually fired — every run in this repo's
# history is a workflow_dispatch. Events raised by a workflow using the default
# GITHUB_TOKEN do not trigger other workflows, and CI / Release creates the Release
# with that token. **Dispatching this manually is the release process**:
#
#     gh workflow run chocolatey.yml -f tag=vX.Y.Z
#
# See docs/release.md for the full post-tag checklist.
#
# Requires repo secret CHOCO_API_KEY (from https://community.chocolatey.org/account)
# scoped to push for package id `codeshellmanager`.

on:
  release:
    types: [released]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to publish (e.g. v2.0.0; final releases only)'
        required: true
        type: string

permissions:
  contents: read

jobs:
  publish:
    runs-on: windows-latest
    env:
      # The subject the MSI's signature must carry: umage.ai's Azure Trusted Signing identity (the
      # same value as release-v2.yml's EXPECTED_SIGNER_SUBJECT). Its certificates rotate every few
      # days, so the subject is pinned, not a thumbprint.
      EXPECTED_SIGNER_SUBJECT: 'CN=umage.ai ApS, O=umage.ai ApS, L=2830, S=Capital Region, C=DK'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.tag || github.event.release.tag_name }}
          persist-credentials: false

      - name: Resolve tag and version
        id: ver
        shell: pwsh
        env:
          TAG: ${{ inputs.tag || github.event.release.tag_name }}
        run: |
          $tag = $env:TAG
          if (-not $tag) { Write-Error 'No release tag resolved.'; exit 1 }
          # A final release of version 2 or later only: pre-releases never reach Chocolatey.
          if ($tag -notmatch '^v(\d+)\.\d+\.\d+$' -or [int]$Matches[1] -lt 2) {
            Write-Error "$tag is not a final release tag vMAJOR.MINOR.PATCH with MAJOR >= 2."; exit 1
          }
          $version = $tag.TrimStart('v')
          "tag=$tag"         | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          "version=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          Write-Host "Publishing tag=$tag version=$version"

      - name: Download signed MSI from GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.ver.outputs.tag }}
          VERSION: ${{ steps.ver.outputs.version }}
        run: |
          $tag     = $env:TAG
          $version = $env:VERSION
          $msiName = "CodeShellManager-$version-Setup.msi"
          New-Item -ItemType Directory -Force -Path artifact | Out-Null
          gh release download $tag --repo umage-ai/CodeShellManager --pattern $msiName --dir artifact
          if (-not (Test-Path "artifact\$msiName")) {
            Write-Error "MSI $msiName not found in release $tag."
            exit 1
          }
          $sig = Get-AuthenticodeSignature "artifact\$msiName"
          if ($sig.Status -ne 'Valid') { Write-Error "MSI $msiName is not validly signed ($($sig.Status))."; exit 1 }
          # Valid is not enough: any publicly trusted certificate would pass. It must be ours.
          if ($sig.SignerCertificate.Subject -ne $env:EXPECTED_SIGNER_SUBJECT) {
            Write-Error "MSI $msiName is signed by '$($sig.SignerCertificate.Subject)', not the expected umage.ai identity."; exit 1
          }
          Write-Host "Downloaded artifact\$msiName"

      - name: Template version, URL, and checksum into package
        shell: pwsh
        env:
          VERSION: ${{ steps.ver.outputs.version }}
        run: |
          $version = $env:VERSION
          $msiName = "CodeShellManager-$version-Setup.msi"
          $url64   = "https://github.com/umage-ai/CodeShellManager/releases/download/v$version/$msiName"
          $sha256  = (Get-FileHash "artifact\$msiName" -Algorithm SHA256).Hash.ToLowerInvariant()
          Write-Host "URL:      $url64"
          Write-Host "SHA256:   $sha256"

          $installPs1 = '.chocolatey/tools/chocolateyinstall.ps1'
          (Get-Content $installPs1 -Raw).
            Replace('__URL64__', $url64).
            Replace('__CHECKSUM64__', $sha256) |
            Set-Content -Path $installPs1 -NoNewline

          $nuspec = '.chocolatey/codeshellmanager.nuspec'
          (Get-Content $nuspec -Raw).
            Replace('__VERSION__', $version) |
            Set-Content -Path $nuspec -NoNewline

          Write-Host '--- chocolateyinstall.ps1 ---'
          Get-Content $installPs1
          Write-Host '--- codeshellmanager.nuspec ---'
          Get-Content $nuspec

      - name: choco pack
        shell: pwsh
        run: |
          choco pack .chocolatey/codeshellmanager.nuspec --out artifact
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Get-ChildItem artifact\*.nupkg

      - name: choco push
        shell: pwsh
        env:
          CHOCO_API_KEY: ${{ secrets.CHOCO_API_KEY }}
          VERSION: ${{ steps.ver.outputs.version }}
        run: |
          $version = $env:VERSION
          $nupkg   = "artifact/codeshellmanager.$version.nupkg"
          if (-not (Test-Path $nupkg)) {
            Write-Error "Expected nupkg not found: $nupkg"
            exit 1
          }
          choco push $nupkg --source https://push.chocolatey.org/ --api-key $env:CHOCO_API_KEY
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Upload built nupkg as workflow artifact
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: codeshellmanager-chocolatey-${{ steps.ver.outputs.version }}
          path: artifact/*.nupkg
          if-no-files-found: warn
