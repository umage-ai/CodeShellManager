name: Release (v2 beta, Linux and macOS)

# CodeShellManager (version 2) for Linux and macOS: release builds and packages, uploaded as WORKFLOW
# ARTIFACTS only. Nothing here creates a GitHub Release, pushes to a package repository or tap,
# or publishes anywhere: docs/distribution.md is the plan for that.
#
# macOS runners cost about ten times Linux ones, so macOS is built ONLY when asked for:
#   - a `vMAJOR.MINOR.PATCH[-beta.N|-rc.N]` tag with MAJOR >= 2 (e.g. v2.0.0-beta.1; the same rule
#     as release-v2.yml): Linux only, version from the tag (the
#     Windows MSI comes from release-v2.yml on the same tag).
#   - a push to `release-macos/v2.<version>` (e.g. `git push origin v2.0.0-beta.1:refs/heads/release-macos/v2.0.0-beta.1`):
#     macOS only, for that release. The tag must exist and point at the same commit. The app is
#     signed and notarized when the Apple secrets below exist.
#   - a push to `release-macos/<anything else>`: a macOS dry run, version 2.0.0-dev.<run number>,
#     never signed.
#   - workflow_dispatch, or a push to a `release-dry-run/<name>` branch: a Linux dry run, version
#     2.0.0-dev.<run number>. The branch push works without a copy of this file on main.
#   Delete a release-macos/ or release-dry-run/ branch after its run.
# Like release-v2.yml, GitHub only dispatches a workflow that exists on the default branch, so a
# copy of this file must sit on main before `gh workflow run release-v2-unix.yml --ref v2` works.
# The jobs refuse any ref other than the v2 or main branch, a release-dry-run/ or release-macos/
# branch, or a tag with MAJOR >= 2 (v0.x/v1 tags are skipped).
#
# Artifacts (one per platform, named like release-v2.yml's `codeshellmanager-<version>`):
#   codeshellmanager-<ver>-linux-x86_64   CodeShellManager-<ver>-linux-x86_64.tar.gz
#                                         CodeShellManager-<ver>-x86_64.AppImage
#                                         codeshellmanager_<debver>_amd64.deb
#   codeshellmanager-<ver>-linux-aarch64  the same for aarch64 / arm64
#   codeshellmanager-<ver>-macos          CodeShellManager-<ver>-macos-universal.dmg (arm64 + x86_64)
#
# macOS signing and notarization (skipped unless ALL of these secrets exist, and only on a tag):
#   APPLE_CERTIFICATE_P12        base64 of a "Developer ID Application" certificate + key (.p12)
#   APPLE_CERTIFICATE_PASSWORD   the .p12's password
#   APPLE_SIGNING_IDENTITY       e.g. "Developer ID Application: umage ApS (TEAMID1234)"
#   APPLE_API_KEY_ID             App Store Connect API key id (notarytool)
#   APPLE_API_ISSUER_ID          App Store Connect issuer id
#   APPLE_API_KEY_P8             base64 of the AuthKey_<id>.p8 file
# Without them the app is ad-hoc signed: it runs, but Gatekeeper blocks the first launch of a
# downloaded copy (System Settings > Privacy & Security > Open Anyway).

on:
  push:
    # MAJOR >= 2 only, the same rule as release-v2.yml (the Versions step checks it again).
    tags: ['v[2-9].*.*', 'v[1-9][0-9]+.*.*']
    # A dry run without a copy of this file on main: push v2 to a release-dry-run/<name> branch.
    branches: ['release-dry-run/**', 'release-macos/**']
  workflow_dispatch:

permissions:
  contents: read   # artifacts only; no release is created here

env:
  CARGO_TERM_COLOR: always

jobs:
  # ── Versions (shared, so every package carries the same numbers) ──────────────────────────
  version:
    if: github.ref == 'refs/heads/v2' || github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/heads/release-dry-run/') || startsWith(github.ref, 'refs/heads/release-macos/') || startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    outputs:
      semver: ${{ steps.ver.outputs.semver }}
      base: ${{ steps.ver.outputs.base }}
      deb: ${{ steps.ver.outputs.deb }}
      release: ${{ steps.ver.outputs.release }}
    steps:
      # semver (Cargo, file names):  2.0.0-beta.3
      # base (CFBundleShortVersionString, must be numeric): 2.0.0
      # deb (Debian sorts `~` before anything, so 2.0.0~beta.3 < 2.0.0): 2.0.0~beta.3
      - name: Versions
        id: ver
        shell: bash
        env:
          IS_TAG: ${{ startsWith(github.ref, 'refs/tags/v') }}
          REF_NAME: ${{ github.ref_name }}
          RUN_NUMBER: ${{ github.run_number }}
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          # REF_NAME is untrusted (a branch or tag name chosen by whoever pushes): it is validated
          # against the strict regex below before it is used for anything else.
          re='^([0-9]{1,3})\.([0-9]{1,3})\.([0-9]{1,5})(-(beta|rc|dev)\.([0-9]{1,5}))?$'
          # release-macos/vX.Y.Z: build the release of tag vX.Y.Z, which must be this very commit.
          case "$REF_NAME" in
            release-macos/v[0-9]*)
              tag="${REF_NAME#release-macos/}"
              if ! [[ "${tag#v}" =~ $re ]]; then echo "::error::The release-macos branch does not name a valid version tag"; exit 1; fi
              tag_sha=$(gh api "repos/$REPO/commits/$tag" --jq .sha) || { echo "::error::The tag does not exist"; exit 1; }
              if [ "$tag_sha" != "$GITHUB_SHA" ]; then echo "::error::The tag is not this branch's commit"; exit 1; fi
              IS_TAG=true; REF_NAME="$tag" ;;
          esac
          echo "release=$IS_TAG" >> "$GITHUB_OUTPUT"
          if [ "$IS_TAG" = "true" ]; then semver="${REF_NAME#v}"; else semver="2.0.0-dev.${RUN_NUMBER}"; fi
          if ! [[ "$semver" =~ $re ]]; then
            echo "::error::The version is not MAJOR.MINOR.PATCH[-beta.N|-rc.N]"; exit 1
          fi
          if (( 10#${BASH_REMATCH[1]} < 2 )); then echo "::error::The version is below 2.0.0: WPF tags are not built here"; exit 1; fi
          base="${BASH_REMATCH[1]}.${BASH_REMATCH[2]}.${BASH_REMATCH[3]}"
          if [ -n "${BASH_REMATCH[4]}" ]; then deb="${base}~${BASH_REMATCH[5]}.${BASH_REMATCH[6]}"; else deb="$base"; fi
          { echo "semver=$semver"; echo "base=$base"; echo "deb=$deb"; } >> "$GITHUB_OUTPUT"
          echo "semver $semver, base $base, deb $deb"

  # ── Linux: tar.gz, AppImage, .deb ─────────────────────────────────────────────────────────
  linux:
    name: linux (${{ matrix.arch }})
    needs: version
    if: ${{ !startsWith(github.ref, 'refs/heads/release-macos/') }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # 22.04, not latest: the binaries need the glibc they were linked against or newer, and
          # 22.04's 2.35 keeps Debian 12, Ubuntu 22.04 and RHEL/Fedora of the same age working.
          - { arch: x86_64,  deb_arch: amd64, runner: ubuntu-22.04 }
          - { arch: aarch64, deb_arch: arm64, runner: ubuntu-22.04-arm }
    env:
      SEMVER: ${{ needs.version.outputs.semver }}
      DEBVER: ${{ needs.version.outputs.deb }}
      ARCH: ${{ matrix.arch }}
      DEB_ARCH: ${{ matrix.deb_arch }}
      # appimagetool and its type2 runtime, pinned by version and SHA-256 (the runtime is passed
      # with --runtime-file so the tool downloads nothing itself). Hashes: docs/release.md.
      APPIMAGETOOL_VERSION: "1.9.0"
      APPIMAGETOOL_SHA256_X86_64: 46fdd785094c7f6e545b61afcfb0f3d98d8eab243f644b4b17698c01d06083d1
      APPIMAGETOOL_SHA256_AARCH64: 04f45ea45b5aa07bb2b071aed9dbf7a5185d3953b11b47358c1311f11ea94a96
      TYPE2_RUNTIME_RELEASE: "20251108"
      TYPE2_RUNTIME_SHA256_X86_64: 2fca8b443c92510f1483a883f60061ad09b46b978b2631c807cd873a47ec260d
      TYPE2_RUNTIME_SHA256_AARCH64: 00cbdfcf917cc6c0ff6d3347d59e0ca1f7f45a6df1a428a0d6d8a78664d87444
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      # The gate's toolchain (see ci.yml).
      - uses: dtolnay/rust-toolchain@df2a88e9fe4098bad09cb42c3dec7187f15861fc # master
        with:
          toolchain: "1.97"

      # The Linux job holds no secrets (read-only token, artifacts only), so it may use the cache.
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          key: release-${{ matrix.arch }}

      # Build: the libraries ci.yml installs (egui / winit / wgpu headers). Packaging: dpkg-dev
      # (dpkg-shlibdeps), desktop-file-utils (desktop-file-validate), file.
      - name: System libraries and packaging tools
        run: |
          sudo apt-get update
          sudo apt-get install -y libxkbcommon-dev libwayland-dev libx11-dev libxrandr-dev libxi-dev libgl1-mesa-dev libgtk-3-dev \
            dpkg-dev desktop-file-utils file

      - name: Stamp the workspace version
        shell: bash
        run: |
          set -euo pipefail
          perl -0pi -e 's/^version = "[^"]*"/version = "$ENV{SEMVER}"/m' Cargo.toml
          grep -q "^version = \"$SEMVER\"" Cargo.toml || { echo "::error::workspace version line not found in Cargo.toml"; exit 1; }

      - name: Build
        run: cargo build --release -p codeshell -p csm-cli -p csm-session-summary -p csm-review

      # The app directory every package ships: the programs and samples/addons side by side, as in
      # the Windows zip (the app finds the sample add-ons and its helper programs beside its own exe).
      - name: Stage
        shell: bash
        run: |
          set -euo pipefail
          app=stage/app
          mkdir -p "$app" dist stage/icons
          for f in codeshell csm csm-session-summary csm-review; do
            test -f "target/release/$f" || { echo "::error::missing from the build: $f"; exit 1; }
            install -m 0755 "target/release/$f" "$app/"
            # The right architecture, and an ELF executable (not a script or a stray file).
            desc="$(file -b "$app/$f")"
            echo "$f: $desc"
            case "$ARCH" in
              x86_64)  [[ "$desc" == *"ELF 64-bit"*"x86-64"* ]] ;;
              aarch64) [[ "$desc" == *"ELF 64-bit"*"ARM aarch64"* ]] ;;
            esac || { echo "::error::$f is not a $ARCH ELF executable"; exit 1; }
          done
          for d in samples/addons/*/; do
            s="$(basename "$d")"
            mkdir -p "$app/samples/addons/$s"
            cp "samples/addons/$s/addon.toml" "$app/samples/addons/$s/"
            # A theme add-on's fonts/ folder (with the licences) goes along.
            if [ -d "samples/addons/$s/fonts" ]; then cp -r "samples/addons/$s/fonts" "$app/samples/addons/$s/fonts"; fi
          done
          python3 -I scripts/ico-to-png.py apps/codeshell/assets/codeshell.ico stage/icons/256.png
          desktop-file-validate installer/linux/ai.umage.CodeShellManager.desktop
          # The CLI must run on a machine with no display (it is what `csm mcp` clients start).
          "$app/csm" --help > /dev/null || echo "::warning::csm --help exited non-zero"

      - name: Tarball
        shell: bash
        run: |
          set -euo pipefail
          name="CodeShellManager-${SEMVER}-linux-${ARCH}"
          root="stage/tar/$name"
          mkdir -p "$root/share/applications" "$root/share/icons/hicolor/256x256/apps"
          cp -a stage/app/. "$root/"
          cp installer/linux/ai.umage.CodeShellManager.desktop "$root/share/applications/"
          cp stage/icons/256.png "$root/share/icons/hicolor/256x256/apps/ai.umage.CodeShellManager.png"
          cp LICENSE "$root/"
          tar -C stage/tar -czf "dist/$name.tar.gz" "$name"

      - name: Debian package
        shell: bash
        run: |
          set -euo pipefail
          pkg=stage/deb
          lib="$pkg/usr/lib/codeshellmanager"
          mkdir -p "$lib" "$pkg/usr/bin" "$pkg/usr/share/applications" \
                   "$pkg/usr/share/icons/hicolor/256x256/apps" "$pkg/usr/share/doc/codeshellmanager" "$pkg/DEBIAN"
          cp -a stage/app/. "$lib/"
          # On PATH by symlink: the app resolves its own folder through /proc/self/exe, so it still
          # finds samples/ and csm-review / csm-session-summary under /usr/lib/codeshellmanager.
          ln -s ../lib/codeshellmanager/codeshell "$pkg/usr/bin/codeshell"
          ln -s ../lib/codeshellmanager/csm "$pkg/usr/bin/csm"
          cp installer/linux/ai.umage.CodeShellManager.desktop "$pkg/usr/share/applications/"
          install -m 0644 stage/icons/256.png "$pkg/usr/share/icons/hicolor/256x256/apps/ai.umage.CodeShellManager.png"
          install -m 0644 LICENSE "$pkg/usr/share/doc/codeshellmanager/copyright"

          # Libraries the programs link against (normally only libc, libm, libgcc_s)...
          mkdir -p stage/shlibs/debian
          printf 'Source: codeshellmanager\n\nPackage: codeshellmanager\nArchitecture: any\n' > stage/shlibs/debian/control
          linked="$(cd stage/shlibs && dpkg-shlibdeps -O $(for f in codeshell csm csm-session-summary csm-review; do echo "../../$lib/$f"; done) \
                     | sed -n 's/^shlibs:Depends=//p')"
          # ...plus the ones winit and wgpu open at run time with dlopen, which dpkg-shlibdeps cannot
          # see: X11 or Wayland, xkbcommon, and EGL (GL fallback) / Vulkan (preferred) for wgpu.
          dlopened="libxkbcommon0, libxkbcommon-x11-0, libx11-6, libx11-xcb1, libxcursor1, libxi6, libxrandr2, libwayland-client0, libwayland-cursor0, libwayland-egl1, libegl1"
          size="$(du -sk --exclude=DEBIAN "$pkg" | cut -f1)"
          cat > "$pkg/DEBIAN/control" <<EOF
          Package: codeshellmanager
          Version: ${DEBVER}
          Architecture: ${DEB_ARCH}
          Maintainer: umage.ai <https://github.com/umage-ai/CodeShellManager/issues>
          Installed-Size: ${size}
          Depends: ${linked:+$linked, }${dlopened}
          Recommends: libvulkan1, mesa-vulkan-drivers, gnome-keyring | kwalletmanager, git
          Section: devel
          Priority: optional
          Homepage: https://github.com/umage-ai/CodeShellManager
          Description: Terminal session manager for Claude Code and other coding CLIs
           CodeShellManager runs and organises many terminal sessions (Claude Code, Codex,
           Gemini CLI, plain shells) in one window, with status, search and an MCP bridge
           (the csm command) for agents.
          EOF
          cat "$pkg/DEBIAN/control"
          dpkg-deb --root-owner-group --build "$pkg" "dist/codeshellmanager_${DEBVER}_${DEB_ARCH}.deb"
          dpkg-deb --info "dist/codeshellmanager_${DEBVER}_${DEB_ARCH}.deb"
          dpkg-deb --contents "dist/codeshellmanager_${DEBVER}_${DEB_ARCH}.deb"

      - name: AppImage
        shell: bash
        run: |
          set -euo pipefail
          appdir=stage/AppDir
          mkdir -p "$appdir/usr/lib/codeshellmanager" "$appdir/usr/share/applications" "$appdir/usr/share/icons/hicolor/256x256/apps"
          cp -a stage/app/. "$appdir/usr/lib/codeshellmanager/"
          cp installer/linux/ai.umage.CodeShellManager.desktop "$appdir/"
          cp installer/linux/ai.umage.CodeShellManager.desktop "$appdir/usr/share/applications/"
          cp stage/icons/256.png "$appdir/ai.umage.CodeShellManager.png"
          cp stage/icons/256.png "$appdir/usr/share/icons/hicolor/256x256/apps/ai.umage.CodeShellManager.png"
          ln -s ai.umage.CodeShellManager.png "$appdir/.DirIcon"
          # AppRun: the app by default; the CLI when called as `<AppImage> csm ...` or through a
          # symlink named csm (so `csm mcp` can point at the AppImage). No LD_LIBRARY_PATH: the
          # programs bundle no libraries, and shells started in the app must not inherit one.
          cat > "$appdir/AppRun" <<'EOF'
          #!/bin/sh
          HERE="$(dirname "$(readlink -f "$0")")"
          BIN="$HERE/usr/lib/codeshellmanager"
          if [ "$(basename "${ARGV0:-$0}")" = "csm" ]; then exec "$BIN/csm" "$@"; fi
          if [ "${1:-}" = "csm" ]; then shift; exec "$BIN/csm" "$@"; fi
          exec "$BIN/codeshell" "$@"
          EOF
          chmod 0755 "$appdir/AppRun"

          case "$ARCH" in
            x86_64)  tool_sha="$APPIMAGETOOL_SHA256_X86_64";  rt_sha="$TYPE2_RUNTIME_SHA256_X86_64" ;;
            aarch64) tool_sha="$APPIMAGETOOL_SHA256_AARCH64"; rt_sha="$TYPE2_RUNTIME_SHA256_AARCH64" ;;
            *) echo "::error::no pinned appimagetool for $ARCH"; exit 1 ;;
          esac
          tool="stage/appimagetool-${ARCH}.AppImage"
          runtime="stage/runtime-${ARCH}"
          curl -fsSL -o "$tool" "https://github.com/AppImage/appimagetool/releases/download/${APPIMAGETOOL_VERSION}/appimagetool-${ARCH}.AppImage"
          curl -fsSL -o "$runtime" "https://github.com/AppImage/type2-runtime/releases/download/${TYPE2_RUNTIME_RELEASE}/runtime-${ARCH}"
          # Verify BEFORE the first use; a mismatch stops the build.
          echo "$tool_sha  $tool" | sha256sum -c -
          echo "$rt_sha  $runtime" | sha256sum -c -
          chmod +x "$tool"
          # Runners have no FUSE: let the tool unpack itself instead of mounting.
          APPIMAGE_EXTRACT_AND_RUN=1 ARCH="$ARCH" "$tool" --no-appstream --runtime-file "$runtime" "$appdir" "dist/CodeShellManager-${SEMVER}-${ARCH}.AppImage"
          chmod +x "dist/CodeShellManager-${SEMVER}-${ARCH}.AppImage"

      - name: Checksums
        shell: bash
        run: cd dist && sha256sum * | tee SHA256SUMS-linux-${ARCH}.txt

      - name: Upload packages
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: codeshellmanager-${{ needs.version.outputs.semver }}-linux-${{ matrix.arch }}
          path: dist/*
          if-no-files-found: error

  # ── macOS: universal .app in a .dmg ───────────────────────────────────────────────────────
  macos:
    needs: version
    # Only when asked for (see the top of this file).
    if: startsWith(github.ref, 'refs/heads/release-macos/')
    runs-on: macos-latest
    env:
      SEMVER: ${{ needs.version.outputs.semver }}
      BASE: ${{ needs.version.outputs.base }}
      BUILD: ${{ github.run_number }}
      IS_TAG: ${{ needs.version.outputs.release }}
      HAS_APPLE_SIGNING: ${{ secrets.APPLE_CERTIFICATE_P12 != '' && secrets.APPLE_CERTIFICATE_PASSWORD != '' && secrets.APPLE_SIGNING_IDENTITY != '' && secrets.APPLE_API_KEY_ID != '' && secrets.APPLE_API_ISSUER_ID != '' && secrets.APPLE_API_KEY_P8 != '' }}
      # Matches LSMinimumSystemVersion in installer/macos/Info.plist.
      MACOSX_DEPLOYMENT_TARGET: "11.0"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@df2a88e9fe4098bad09cb42c3dec7187f15861fc # master
        with:
          toolchain: "1.97"
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      # No build cache here: this job holds the Apple signing secrets, and a restored cache is
      # attacker-reachable input to what gets signed.

      - name: Stamp the workspace version
        shell: bash
        run: |
          set -euo pipefail
          perl -0pi -e 's/^version = "[^"]*"/version = "$ENV{SEMVER}"/m' Cargo.toml
          grep -q "^version = \"$SEMVER\"" Cargo.toml || { echo "::error::workspace version line not found in Cargo.toml"; exit 1; }

      - name: Build (arm64 and x86_64)
        run: |
          cargo build --release --target aarch64-apple-darwin -p codeshell -p csm-cli -p csm-session-summary -p csm-review
          cargo build --release --target x86_64-apple-darwin  -p codeshell -p csm-cli -p csm-session-summary -p csm-review

      # CodeShellManager.app/Contents/
      #   Info.plist
      #   MacOS/      codeshell (CFBundleExecutable), csm, csm-review, csm-session-summary
      #   Resources/  AppIcon.icns, samples/addons/* (data files may not sit in MacOS/: codesign
      #               would treat them as code; the app looks in ../Resources too)
      - name: App bundle
        shell: bash
        run: |
          set -euo pipefail
          app="stage/CodeShellManager.app"
          mkdir -p "$app/Contents/MacOS" "$app/Contents/Resources" dist
          for f in codeshell csm csm-session-summary csm-review; do
            lipo -create -output "$app/Contents/MacOS/$f" \
              "target/aarch64-apple-darwin/release/$f" "target/x86_64-apple-darwin/release/$f"
            archs="$(lipo -archs "$app/Contents/MacOS/$f")"
            echo "$f: $archs"
            [[ "$archs" == *arm64* && "$archs" == *x86_64* ]] || { echo "::error::$f is not universal"; exit 1; }
          done
          for d in samples/addons/*/; do
            s="$(basename "$d")"
            mkdir -p "$app/Contents/Resources/samples/addons/$s"
            cp "samples/addons/$s/addon.toml" "$app/Contents/Resources/samples/addons/$s/"
          done

          # Icon: the .ico's 256 px image, scaled down for the smaller slots.
          python3 -I scripts/ico-to-png.py apps/codeshell/assets/codeshell.ico stage/icon-256.png
          set_dir=stage/AppIcon.iconset
          mkdir -p "$set_dir"
          for spec in 16:icon_16x16 32:icon_16x16@2x 32:icon_32x32 64:icon_32x32@2x 128:icon_128x128 256:icon_128x128@2x 256:icon_256x256; do
            sips -z "${spec%%:*}" "${spec%%:*}" stage/icon-256.png --out "$set_dir/${spec#*:}.png" > /dev/null
          done
          iconutil -c icns "$set_dir" -o "$app/Contents/Resources/AppIcon.icns"

          sed -e "s/@SHORT_VERSION@/${BASE}/" -e "s/@BUILD@/${BUILD}/" -e "s/@SEMVER@/${SEMVER}/" \
            installer/macos/Info.plist > "$app/Contents/Info.plist"
          plutil -lint "$app/Contents/Info.plist"
          printf 'APPL????' > "$app/Contents/PkgInfo"

          "$app/Contents/MacOS/csm" --help > /dev/null || echo "::warning::csm --help exited non-zero"

      # Developer ID signing, hardened runtime, secure timestamp: what notarization requires.
      # The helpers are signed first, then the bundle (no --deep: it signs in the wrong order and
      # hides mistakes).
      - name: Sign (Developer ID)
        if: env.IS_TAG == 'true' && env.HAS_APPLE_SIGNING == 'true'
        shell: bash
        env:
          APPLE_CERTIFICATE_P12: ${{ secrets.APPLE_CERTIFICATE_P12 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
        run: |
          set -euo pipefail
          kc="$RUNNER_TEMP/signing.keychain-db"
          kc_pw="$(openssl rand -hex 24)"
          echo "$APPLE_CERTIFICATE_P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security create-keychain -p "$kc_pw" "$kc"
          security set-keychain-settings -lut 21600 "$kc"
          security unlock-keychain -p "$kc_pw" "$kc"
          security import "$RUNNER_TEMP/cert.p12" -P "$APPLE_CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k "$kc"
          security set-key-partition-list -S apple-tool:,apple: -k "$kc_pw" "$kc" > /dev/null
          security list-keychains -d user -s "$kc" $(security list-keychains -d user | tr -d '"')
          rm -f "$RUNNER_TEMP/cert.p12"

          app="stage/CodeShellManager.app"
          for f in csm csm-session-summary csm-review codeshell; do
            codesign --force --options runtime --timestamp --keychain "$kc" --sign "$APPLE_SIGNING_IDENTITY" "$app/Contents/MacOS/$f"
          done
          codesign --force --options runtime --timestamp --keychain "$kc" --sign "$APPLE_SIGNING_IDENTITY" "$app"
          codesign --verify --strict --verbose=2 "$app"

      # Unsigned build: ad-hoc sign the whole bundle so its seal covers Info.plist and Resources
      # (the linker's per-binary ad-hoc signatures do not), which arm64 Macs need to launch it.
      - name: Sign (ad hoc)
        if: env.IS_TAG != 'true' || env.HAS_APPLE_SIGNING != 'true'
        shell: bash
        run: |
          set -euo pipefail
          app="stage/CodeShellManager.app"
          for f in csm csm-session-summary csm-review codeshell; do codesign --force --sign - "$app/Contents/MacOS/$f"; done
          codesign --force --sign - "$app"
          codesign --verify --strict --verbose=2 "$app"

      - name: Disk image
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p stage/dmg
          cp -R stage/CodeShellManager.app stage/dmg/
          ln -s /Applications stage/dmg/Applications
          hdiutil create -volname "CodeShellManager" -srcfolder stage/dmg -ov -format UDZO \
            "dist/CodeShellManager-${SEMVER}-macos-universal.dmg"

      - name: Sign, notarize and staple the disk image
        if: env.IS_TAG == 'true' && env.HAS_APPLE_SIGNING == 'true'
        shell: bash
        env:
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
        run: |
          set -euo pipefail
          dmg="dist/CodeShellManager-${SEMVER}-macos-universal.dmg"
          codesign --force --timestamp --keychain "$RUNNER_TEMP/signing.keychain-db" --sign "$APPLE_SIGNING_IDENTITY" "$dmg"
          key="$RUNNER_TEMP/AuthKey.p8"
          echo "$APPLE_API_KEY_P8" | base64 --decode > "$key"
          xcrun notarytool submit "$dmg" --key "$key" --key-id "$APPLE_API_KEY_ID" --issuer "$APPLE_API_ISSUER_ID" --wait --timeout 30m
          rm -f "$key"
          xcrun stapler staple "$dmg"
          xcrun stapler validate "$dmg"
          spctl --assess --type open --context context:primary-signature --verbose=2 "$dmg"

      - name: Remove the signing keychain
        if: always() && env.IS_TAG == 'true' && env.HAS_APPLE_SIGNING == 'true'
        shell: bash
        run: security delete-keychain "$RUNNER_TEMP/signing.keychain-db" || true

      - name: Checksums
        shell: bash
        run: cd dist && shasum -a 256 * | tee SHA256SUMS-macos.txt

      - name: Upload packages
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: codeshellmanager-${{ needs.version.outputs.semver }}-macos
          path: dist/*
          if-no-files-found: error
